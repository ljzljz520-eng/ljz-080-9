{% extends "base.html" %}
{% block content %}
<div class="card form-card" style="margin:40px auto">
  <h2 class="mt0">登录</h2>
  <form method="post" action="/auth/login">
    <input type="hidden" name="next" value="{{ next_url }}">
    <label class="field">用户名<input type="text" name="username" required autofocus></label>
    <label class="field">密码<input type="password" name="password" required></label>
    <button class="btn" type="submit" style="width:100%">登录</button>
  </form>
  <p class="muted small mt">还没有账号？<a href="/auth/register">注册新用户</a></p>
  <div class="alert alert-info small">
    演示账号：<br>
    管理员 admin / admin123<br>
    农户 laowang / farmer123<br>
    消费者 xiaoming / consumer123
  </div>
</div>
{% endblock %}
